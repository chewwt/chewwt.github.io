# ============================================================
# ABSTRACT
# ============================================================
tagline: >
  [[bolt]] is the first BBO benchmark grounded in real LLM experiments, accessible without large-scale compute.

abstract: >
  LLMs involve noisy, expensive, derivative-free decisions — hyperparameters, data mixtures, prompts, parallelism
  strategies — that black-box optimization (BBO) is built to handle. Yet most BBO research validates on synthetic
  functions that miss the real structure of LLM tasks. [[bolt]] provides problems grounded in real LLM experiments,
  spanning multi-fidelity, multi-objective, heteroscedastic noise, high-dimensional, and constrained settings, all
  queryable through lightweight emulators or tabular data. BO methods generally outperform other baselines, but no
  single method wins across tasks, and methods remain far from optimal on some problems.

# stats: highlight numbers shown as cards below the abstract
stats:
  - value: "4"
    label: "task families"
  - value: "13"
    label: "LLM problems"
  - value: "30k+"
    label: "real experiments"
  - value: "30+"
    label: "methods benchmarked"

# ============================================================
# TEASER / OVERVIEW FIGURE
# Set image to "" to hide the section
# ============================================================
teaser:
  image: "assets/images/bolt/overview.png"
  caption: >
    <strong>[[bolt]] replaces slow LLM calls with a fast emulator.</strong>
    Without an emulator (left), each BBO query requires real LLM training and evaluation, which is slow, costly,
    and hard to reproduce. With [[bolt]] (right), the BBO method queries an emulator (MLP) or tabular data
    built from real LLM experiments, returning observations almost instantly, at negligible cost, and reproducibly.

